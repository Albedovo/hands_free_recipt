<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hands-Free Recipe</title>
<style>
  :root {
    --bg: #f6f1e8;
    --surface: #fffdf8;
    --counter: #ebe2d4;
    --ink: #2b2420;
    --muted: #7a6d63;
    --line: #e4d9c9;
    --accent: #c4552d;
    --ok: #2f7d4a;
    --warn: #b7791f;
    --mark: #fbe7a8;
    --mark-ink: #4a3a10;
    --z-wash: #2f7bb0;
    --z-prep: #4c8a35;
    --z-cook: #cf4b25;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1916;
      --surface: #26221e;
      --counter: #302a24;
      --ink: #f1e9df;
      --muted: #a89a8c;
      --line: #3b342d;
      --accent: #ec7b4f;
      --ok: #6cc28a;
      --warn: #e5b04f;
      --mark: #5a4a1c;
      --mark-ink: #fbe7a8;
      --z-wash: #5aa6dc;
      --z-prep: #79b85e;
      --z-cook: #ef7650;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-text-size-adjust: 100%;
  }
  button, select {
    font: inherit;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); border-color: var(--accent); }
  mark { background: var(--mark); color: var(--mark-ink); border-radius: 5px; padding: 0 .2em; white-space: nowrap; }

  /* ---------- Header ---------- */
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px 10px;
    padding: 8px 20px;
    padding-top: max(8px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .brand { font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  @media (max-width: 1000px) { .brand small { display: none; } }
  #recipeBtn { font-weight: 700; margin-right: auto; min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #recipeBtn::after { content: " ▾"; color: var(--muted); font-weight: 400; }
  .icon-btn { padding: 8px 12px; white-space: nowrap; }
  .conn { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.on { background: var(--ok); }
  .dot.err { background: var(--accent); }
  .hint { flex: none; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); padding: 8px 20px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .hint:empty { display: none; }

  /* ---------- Kitchen bar ---------- */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .top {
    flex: none;
    padding: 4px 20px 8px;
    border-bottom: 1px solid var(--line);
  }
  .top-inner { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }

  .strip { position: relative; }
  .flags { position: relative; height: 22px; }
  .counter {
    display: grid;
    grid-template-columns: repeat(var(--n), minmax(0, 1fr));
    gap: 4px;
    padding: 4px;
    background: var(--counter);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .zone {
    border-radius: 10px;
    border: 2px solid transparent;
    background: color-mix(in srgb, var(--z) 13%, var(--surface));
    padding: 5px 2px 4px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-width: 0;
    transition: background .2s, color .2s, box-shadow .2s;
  }
  .zone .zi { font-size: 22px; line-height: 1.1; }
  .zone .zt { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .zone .zn { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .zone .zp { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .zone.here { border-color: color-mix(in srgb, var(--ink) 55%, transparent); border-style: dashed; }
  .zone.target { background: var(--z); color: #fff; border: 2px solid var(--z); box-shadow: 0 0 0 4px color-mix(in srgb, var(--z) 30%, transparent); }
  .zone.target .zp { color: rgba(255,255,255,.85); }
  .zone.ping { animation: ping .6s ease-out; }
  @keyframes ping { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
  div.zone { cursor: default; }

  .goal, .you {
    position: absolute;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 13px;
    font-weight: 700;
    border-radius: 999px;
    padding: 1px 10px;
    transition: left .35s ease;
  }
  .goal { bottom: 1px; color: var(--z); }
  .goal.arrived { color: var(--ok); }
  .goal:not(.arrived) { animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translate(-50%, -3px); } }
  .track { position: relative; height: 28px; }
  .you { top: 7px; background: var(--ink); color: var(--bg); }
  .you.moving { animation: pulse .9s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .route { position: absolute; top: 3px; height: 3px; background: var(--accent); border-radius: 2px; transition: left .35s, width .35s; }
  .route::after { content: ""; position: absolute; top: -5px; border: 6.5px solid transparent; }
  .route.right::after { right: -8px; border-left: 9px solid var(--accent); border-right: 0; }
  .route.left::after { left: -8px; border-right: 9px solid var(--accent); border-left: 0; }

  .banner {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px;
    padding: 7px 14px;
    border-radius: 12px;
    font-size: clamp(16px, 2vw, 20px);
    background: color-mix(in srgb, var(--z, var(--accent)) 14%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--z, var(--accent)) 45%, transparent);
  }
  .banner b { color: var(--z, var(--accent)); }
  .banner span { color: var(--muted); font-size: .82em; }
  .banner.ok { --z: var(--ok); }

  .progress { display: flex; }
  .progress button {
    flex: 1; height: 7px; padding: 0; border: none; border-radius: 3px; margin-left: 1px;
    background: color-mix(in srgb, var(--z, var(--muted)) 22%, transparent);
  }
  .progress button.gap { margin-left: 5px; }
  .progress button:first-child { margin-left: 0; }
  .progress button.done { background: color-mix(in srgb, var(--z, var(--muted)) 60%, transparent); }
  .progress button.now { background: var(--z, var(--ink)); outline: 2px solid var(--z, var(--ink)); outline-offset: 1px; }


  /* ---------- One page = one screen, never scrolls ---------- */
  .body {
    flex: 1; min-height: 0;
    width: 100%; max-width: 1000px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card {
    --fs: 1;
    flex: 1; min-height: 0;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 1em 1.2em;
    font-size: calc(var(--fs) * clamp(17px, 2.3vw, 26px));
    display: flex; flex-direction: column;
  }
  .step { border-top: 8px solid var(--z); }
  .step-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .72em; }
  .zone-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--z); color: #fff;
    border-radius: 999px; padding: 3px 12px; font-weight: 700;
    text-transform: capitalize;
  }
  .count { color: var(--muted); font-weight: 600; }
  .subdots { display: inline-flex; gap: 5px; margin-left: auto; }
  .subdots i { width: 10px; height: 10px; border-radius: 50%; background: color-mix(in srgb, var(--z) 25%, transparent); }
  .subdots i.on { background: var(--z); }
  .step-title { display: flex; align-items: center; gap: .5em; margin: .55em 0 0; font-size: 1em; font-weight: 700; color: var(--muted); }
  .verb {
    flex: none; min-width: 1.8em; height: 1.8em; padding: 0 .35em;
    display: grid; place-items: center; border-radius: 10px;
    background: color-mix(in srgb, var(--z) 16%, var(--surface)); color: var(--z);
  }
  html[lang="en"] .verb { font-size: .7em; text-transform: uppercase; letter-spacing: .04em; }
  .instr {
    flex: 1;
    display: flex; align-items: center;
    font-size: 1.75em; font-weight: 700; line-height: 1.3;
    margin: .3em 0;
    text-wrap: pretty;
  }
  .section-label { font-size: .62em; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 .4em; }
  .uses { display: flex; flex-wrap: wrap; gap: .35em; margin-bottom: .3em; }
  .chip {
    font-size: .8em; padding: .2em .7em; border-radius: 999px;
    background: color-mix(in srgb, var(--z, var(--accent)) 10%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--z, var(--accent)) 40%, transparent);
  }
  .callout {
    display: flex; gap: .5em; align-items: flex-start;
    border-radius: 12px; padding: .5em .7em; margin-top: .4em;
    font-size: .85em; line-height: 1.4;
  }
  .callout .ic { font-weight: 800; flex: none; }
  .callout.done { background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
  .callout.done .ic, .callout.done b { color: var(--ok); }
  .callout.warn { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); }
  .callout.warn .ic, .callout.warn b { color: var(--warn); }

  .next-line {
    flex: none;
    display: flex; align-items: baseline; gap: 8px;
    padding: 8px 14px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--z, var(--ok));
    font-size: 15px; min-width: 0;
  }
  .next-line .nl { flex: none; color: var(--muted); font-weight: 700; font-size: 13px; }
  .next-line .nz { flex: none; color: var(--z); font-weight: 700; }
  .next-line .nt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* overview pages */
  .kicker { color: var(--muted); font-weight: 600; margin: 0 0 .3em; font-size: .75em; }
  .ov-title { font-size: 2em; margin: 0 0 .3em; line-height: 1.15; }
  .intro { font-size: .9em; line-height: 1.5; color: var(--muted); margin: 0 0 .8em; }
  .ing { list-style: none; padding: 0; margin: .2em 0 0; columns: 2 13em; column-gap: 1.4em; }
  .ing li { break-inside: avoid; display: flex; justify-content: space-between; gap: .6em; padding: .35em 0; border-bottom: 1px dashed var(--line); font-size: .95em; }
  .ing li span:last-child { color: var(--muted); text-align: right; }
  .tools { font-size: .8em; line-height: 1.5; margin: 0 0 .8em; }
  .route-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .route-chips .rc {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 7px; border-radius: 8px; font-size: 14px; font-weight: 600;
    background: color-mix(in srgb, var(--z) 16%, var(--surface)); color: var(--z);
  }
  .route-chips .arr { color: var(--muted); font-size: 12px; }
  .card .route-chips .rc { font-size: .7em; }

  /* ---------- Footer controls ---------- */
  footer {
    flex: none;
    border-top: 1px solid var(--line);
    background: var(--surface);
    padding: 8px 20px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  .controls { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
  .controls button { font-size: 17px; font-weight: 700; padding: 10px 18px; }
  #prevBtn { justify-self: start; }
  #nextBtn { justify-self: end; }
  .legend { max-width: 960px; margin: 6px auto 0; text-align: center; font-size: 13px; color: var(--muted); }
  .legend b { color: var(--ink); }
  .reading { color: var(--accent); font-weight: 700; animation: pulse 1.4s ease-in-out infinite; }

  .flash {
    position: fixed; left: 50%; top: 40%;
    transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 14px 28px; border-radius: 16px;
    font-size: clamp(20px, 2.4vw, 30px);
    opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 50; max-width: 90vw; text-align: center;
  }
  .flash.show { opacity: .94; }

  /* ---------- Dialogs (these may scroll; they are used by hand) ---------- */
  dialog {
    width: min(680px, calc(100vw - 24px));
    max-height: calc(100dvh - 24px);
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--surface);
    color: var(--ink);
    padding: 0;
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .dlg-head h2 { margin: 0; font-size: 20px; }
  .dlg-body { padding: 16px 18px 22px; }
  .dlg-body h3 { font-size: 15px; margin: 22px 0 8px; }
  .dlg-body h3:first-child { margin-top: 0; }
  .dlg-body .note { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 6px 0 0; }

  .recipe-cards { display: grid; gap: 10px; }
  .recipe-card { display: block; width: 100%; text-align: left; border-radius: 14px; padding: 14px 16px; }
  .recipe-card.current { border-color: var(--accent); border-width: 2px; }
  .recipe-card .rn { font-size: 20px; font-weight: 700; }
  .recipe-card .rm { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }

  .layout-types { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .layout-types label {
    position: relative;
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; text-align: center;
    cursor: pointer;
  }
  .layout-types label:has(input:checked) { border-color: var(--accent); border-width: 2px; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  .layout-types label:has(input:disabled) { opacity: .45; cursor: default; }
  .layout-types input { position: absolute; opacity: 0; pointer-events: none; }
  .layout-types small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .layout-types svg { width: 54px; height: 38px; }
  .layout-types svg rect { fill: var(--counter); stroke: var(--muted); stroke-width: 1.5; }

  #layoutPreview { margin: 4px 0 10px; }
  .zone-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .zone-list li {
    display: grid; grid-template-columns: 28px 30px minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center;
    padding: 8px 10px; border-radius: 12px;
    background: color-mix(in srgb, var(--z) 10%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--z) 35%, transparent);
  }
  .zone-list .pos { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--z); color: #fff; font-weight: 700; font-size: 14px; }
  .zone-list .zi { font-size: 22px; }
  .zone-list .zt b { display: block; text-transform: capitalize; }
  .zone-list .zt small { color: var(--muted); }
  .zone-list select { border-radius: 10px; padding: 6px 8px; font-size: 14px; }
  .zone-list button { border-radius: 10px; padding: 6px 10px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  details.log { margin-top: 18px; font-size: 13px; }
  details.log pre { max-height: 180px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 6px 0 0; white-space: pre-wrap; }

  /* ---------- Phone ---------- */
  @media (max-width: 640px) {
    header { padding: 6px 12px; padding-top: max(6px, env(safe-area-inset-top)); }
    .brand, .wide-only, #connText { display: none; }
    #connectBtn::after { content: "USB"; font-size: 14px; }
    .icon-btn { padding: 7px 10px; }
    .top { padding: 2px 12px 6px; }
    .zone { flex-direction: column; gap: 0; padding: 4px 1px 3px; }
    .zone .zt { align-items: center; }
    .zone .zi { font-size: 18px; }
    .zone .zn { font-size: 13px; }
    .zone .zp { font-size: 10px; }
    .goal, .you { font-size: 12px; padding: 1px 8px; }
    .banner { padding: 6px 12px; font-size: 15px; }
    .body { padding: 8px 12px; gap: 6px; }
    .card { padding: .8em .9em; border-radius: 14px; }
    .next-line { font-size: 14px; padding: 6px 12px; }
    footer { padding: 6px 12px; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
    .controls button { font-size: 16px; padding: 10px 14px; }
    .legend { display: none; }
    .layout-types { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .zone-list li { grid-template-columns: 26px 26px minmax(0, 1fr) auto auto; }
    .zone-list li select { grid-column: 3 / -1; grid-row: 2; justify-self: start; }
  }
  @media (max-height: 560px) { .legend { display: none; } }
</style>
</head>
<body>
<header>
  <div class="brand">Hands-Free Recipe<small data-i18n="tagline"></small></div>
  <button id="recipeBtn" data-i18n-title="pickTitle"></button>
  <button id="langBtn" class="icon-btn" title="中文 / English"></button>
  <button id="settingsBtn" class="icon-btn" data-i18n-title="settingsTitle">⚙<span class="wide-only" data-i18n="settings"></span></button>
  <button id="connectBtn" class="icon-btn conn"><span class="dot" id="connDot"></span><span id="connText"></span></button>
</header>
<div class="hint" id="hint"></div>

<main id="main">
  <div class="top">
    <div class="top-inner">
      <div id="strip"></div>
      <div id="banner"></div>
      <div class="progress" id="progress"></div>
    </div>
  </div>
  <div class="body" id="body"></div>
</main>

<footer>
  <div class="controls">
    <button id="prevBtn"></button>
    <button id="readBtn"></button>
    <button id="nextBtn" class="primary"></button>
  </div>
  <div class="legend" id="legend"></div>
</footer>

<div class="flash" id="flash"></div>

<dialog id="picker">
  <div class="dlg-head"><h2 data-i18n="pick"></h2><button data-close aria-label="Close">✕</button></div>
  <div class="dlg-body"><div class="recipe-cards" id="recipeCards"></div></div>
</dialog>

<dialog id="settings">
  <div class="dlg-head"><h2 data-i18n="settingsTitle"></h2><button data-close aria-label="Close">✕</button></div>
  <div class="dlg-body">
    <h3 data-i18n="layoutType"></h3>
    <div class="layout-types" id="layoutTypes"></div>

    <h3 data-i18n="zoneOrder"></h3>
    <div id="layoutPreview"></div>
    <ol class="zone-list" id="zoneList"></ol>
    <p class="note" data-i18n="pedalNote"></p>
    <p style="margin:10px 0 0"><button id="resetLayout" data-i18n="resetLayout"></button></p>

    <h3 data-i18n="options"></h3>
    <div class="toggles">
      <button id="lockBtn" aria-pressed="false" data-i18n="lock"></button>
      <button id="autoBtn" aria-pressed="false" data-i18n="auto"></button>
    </div>
    <p class="note" data-i18n="optionsNote"></p>

    <details class="log">
      <summary data-i18n="log"></summary>
      <pre id="log"></pre>
    </details>
  </div>
</dialog>

<script>
const L = (zh, en) => ({ zh, en });

/* ---------- Interface text ---------- */
const I18N = {
  zh: {
    tagline: '脚踏菜谱', pick: '选择菜谱', pickTitle: '选择菜谱 (/)',
    settings: ' 厨房设置', settingsTitle: '厨房布局与设置',
    layoutType: '厨房布局', zoneOrder: '区域顺序（从左到右，最上面 = 最左边）',
    pedalNote: '踏板 1 / 2 / 3 对应 Arduino 的 D2 / D3 / D4，默认每个区域一个踏板。',
    resetLayout: '恢复默认顺序', options: '操作',
    optionsNote: '锁定转向：屏幕不动，任何踏板都直接翻页。自动朗读：翻页后自动读出这一页。',
    lock: '锁定转向', auto: '自动朗读',
    layouts: { line: ['长条形', '一字形台面'], l: ['L 形', '即将支持'], galley: ['双排', '即将支持'], island: ['岛台', '即将支持'] },

      { zone: 'prep', verb: L('切', 'Cut'), title: L('切配料', 'Cut the aromatics'),
        uses: [L('青椒', 'Pepper'), L('大蒜 2 瓣', '2 garlic'), L('干辣椒 3 个', '3 chilies')],
        how: [L('青椒去籽切细丝', 'Seed the pepper, cut thin strips'),
              L('蒜切片，干辣椒剪成 1 cm 段', 'Slice the garlic, snip chilies into 1 cm pieces')] },
      { zone: 'prep', verb: L('调', 'Mix'), title: L('调醋汁', 'Mix vinegar sauce'),
        uses: [L('醋 2 大勺', 'Vinegar 2 tbsp'), L('盐 1/2 小勺', 'Salt ½ tsp')],
        how: [L('小碗：醋 2 大勺 + 盐 1/2 小勺，搅到化开', 'Small bowl: 2 tbsp vinegar + ½ tsp salt, stir to dissolve'),
              L('端到灶台：花椒辣椒蒜 → 土豆丝 → 青椒 → 醋汁', 'To the stove: spices → potato → pepper → vinegar')] },
      { zone: 'cook', verb: L('爆', 'Sizzle'), title: L('爆香', 'Sizzle the spices'),
        uses: [L('油 1.5 大勺', 'Oil 1½ tbsp')],
        how: [L('锅烧热，倒油 1.5 大勺', 'Heat the wok, add 1½ tbsp oil'),
              L('下花椒、干辣椒、蒜片，炒 10 秒', 'Add peppercorns, chilies, garlic — 10 seconds')],
        warn: L('辣椒发黑就糊了', 'Black chilies are burnt') },
      { zone: 'cook', verb: L('炒', 'Fry'), title: L('大火快炒', 'Stir-fry on high'),
        uses: [L('土豆丝', 'Potato')],
        how: [L('转大火，倒入沥干的土豆丝', 'High heat, add the drained potato'),
              L('不停翻炒 90 秒', 'Toss non-stop for 90 seconds')],
        done: L('半透明，还是脆的', 'Translucent but still crunchy') },
      { zone: 'cook', verb: L('淋', 'Finish'), title: L('加醋出锅', 'Vinegar and serve'),
        uses: [L('青椒丝', 'Pepper'), L('醋汁', 'Vinegar')],
        how: [L('放入青椒丝，翻炒 20 秒', 'Add the pepper, toss 20 seconds'),
              L('沿锅边淋醋汁，翻匀，出锅', 'Pour vinegar around the hot rim, toss, plate')],
        done: L('醋香明显', 'Clear vinegar aroma') },
    ],
  },
];

/* ---------- State ---------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let lang = store.get('hfr.lang') === 'en' ? 'en' : 'zh';
let T = I18N[lang];
const t = o => (o && typeof o === 'object' ? (o[lang] ?? o.zh) : o);
const $ = id => document.getElementById(id);

function loadLayout() {
  const s = store.get('hfr.layout3');
  if (!s || !Array.isArray(s.order) || s.order.length !== ZONE_IDS.length || !ZONE_IDS.every(z => s.order.includes(z))) {
    return structuredClone(DEFAULT_LAYOUT);
  }
  const pedal = {};
  for (const z of ZONE_IDS) pedal[z] = [0, 1, 2, -1].includes(s.pedal?.[z]) ? s.pedal[z] : DEFAULT_LAYOUT.pedal[z];
  return { type: 'line', order: s.order, pedal };
}
let layout = loadLayout();
function saveLayout() { store.set('hfr.layout3', layout); render(); renderLayoutEditor(); }

const state = {
  recipe: null,
  page: 0,
  at: 1,          // pedal last used = where the person stands (firmware starts facing pedal 2 / index 1)
  moving: false,
  locked: false,
  autoRead: !!store.get('hfr.auto'),
};

/* ---------- Pages: 2 intro pages, then one page per action ---------- */
function pagesOf(r) {
  const pages = [{ type: 'overview' }, { type: 'ingredients' }];
  r.steps.forEach((s, si) => {
    s.how.forEach((text, k) => pages.push({
      type: 'step', step: s, si, n: si + 1, total: r.steps.length,
      sub: k, subs: s.how.length, text, zone: s.zone,
      first: k === 0, last: k === s.how.length - 1,
    }));
  });
  return pages;
}
const page = () => state.recipe.pages[state.page];
const zoneLabel = z => `${ZONES[z].icon} ${t(ZONES[z].name)}`;
const zonesAt = p => layout.order.filter(z => layout.pedal[z] === p);
function targetZone() {
  const p = page();
  return p.type === 'step' ? p.zone : state.recipe.steps[0].zone;
}
function distance(target) {   // positive = to the right
  const here = zonesAt(state.at).map(z => layout.order.indexOf(z));
  if (!here.length) return null;
  const ti = layout.order.indexOf(target);
  if (here.includes(ti)) return 0;
  const nearest = here.reduce((a, b) => (Math.abs(b - ti) < Math.abs(a - ti) ? b : a));
  return ti - nearest;
}

/* ---------- Text ---------- */
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
const KEY_INFO = {
  zh: /\d+(?:\.\d+)?(?:\s*[–\-~到]\s*\d+)?\s*(?:分钟|秒|小时|℃|度|mm|cm|g|ml|L\b)/g,
  en: /(?:\d+(?:\.\d+)?)?[½¼]?(?:\s*[–\-]\s*\d+)?\s*(?:seconds?|minutes?|mins?|hours?|mm|cm|g|ml|L)\b/g,
};
const fmt = s => esc(s).replace(KEY_INFO[lang], m => (/\d|[½¼]/.test(m) ? `<mark>${m}</mark>` : m));
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

/* ---------- Kitchen strip ---------- */
function stripHTML(target, { preview = false } = {}) {
  const n = layout.order.length;
  const center = i => ((i + 0.5) / n) * 100;
  const hereIdx = preview ? [] : zonesAt(state.at).map(z => layout.order.indexOf(z));
  const ti = target ? layout.order.indexOf(target) : -1;
  const arrived = ti >= 0 && hereIdx.includes(ti);
  const tag = preview ? 'div' : 'button';

  const cells = layout.order.map((z, i) => {
    const cls = ['zone'];
    if (i === ti) cls.push('target');
    if (hereIdx.includes(i)) cls.push('here');
    const p = layout.pedal[z];
    return `<${tag} class="${cls.join(' ')}" data-zone="${z}" style="--z:var(--z-${z})">
      <span class="zi">${ZONES[z].icon}</span><span class="zt"><span class="zn">${esc(t(ZONES[z].short))}</span>
      <span class="zp">${p >= 0 ? T.pedalN(p + 1) : T.noPedal}</span></span></${tag}>`;
  }).join('');

  let flags = '', track = '';
  if (ti >= 0) {
    flags = `<span class="goal ${arrived ? 'arrived' : ''}" style="left:${center(ti)}%;--z:var(--z-${target})">${arrived ? T.arrivedHere : T.goHere}</span>`;
  }
  if (hereIdx.length) {
    const youPos = hereIdx.reduce((a, b) => a + center(b), 0) / hereIdx.length;
    if (ti >= 0 && !arrived) {
      const d = distance(target);
      const from = center(ti - d);
      track += `<span class="route ${d > 0 ? 'right' : 'left'}" style="left:${Math.min(from, center(ti))}%;width:${Math.abs(center(ti) - from)}%"></span>`;
    }
    track += `<span class="you ${state.moving ? 'moving' : ''}" style="left:${youPos}%">🧍 ${T.youHere}</span>`;
  }
  return `<div class="strip" style="--n:${n}">
    ${preview ? '' : `<div class="flags">${flags}</div>`}
    <div class="counter">${cells}</div>
    ${preview ? '' : `<div class="track">${track}</div>`}
  </div>`;
}

function bannerHTML(target) {
  const p = page();
  const intro = p.type !== 'step';
  const d = distance(target);
  if (d === 0) {
    const text = intro ? T.startAt(zoneLabel(target)) : T.youAreAt(zoneLabel(target));
    const sub = intro ? T.startSub : state.locked ? T.lockedNote : '';
    return `<div class="banner ok"><b>${text}</b>${sub ? `<span>${sub}</span>` : ''}</div>`;
  }
  const pedal = layout.pedal[target];
  const parts = [];
  if (d !== null) parts.push(T.steps(d));
  if (state.moving) parts.push(T.turningScreen);
  else if (state.locked) parts.push(T.lockedNote);
  else if (pedal >= 0) parts.push(T.pressPedal(pedal + 1));
  const head = intro ? T.startAt(zoneLabel(target)) : T.goTo(zoneLabel(target));
  return `<div class="banner" style="--z:var(--z-${target})"><b>${head}</b><span>${parts.join(' · ')}</span></div>`;
}

/* ---------- Render ---------- */
function render() {
  const r = state.recipe;
  if (!r) return;
  const p = page();
  const target = targetZone();
  $('recipeBtn').textContent = t(r.name);
  $('strip').innerHTML = stripHTML(target);
  $('banner').innerHTML = bannerHTML(target);
  $('progress').innerHTML = r.pages.map((q, i) => {
    const prevQ = r.pages[i - 1];
    const gap = i > 0 && (!prevQ || prevQ.si !== q.si) ? ' gap' : '';
    const st = i < state.page ? ' done' : i === state.page ? ' now' : '';
    return `<button data-page="${i}" class="${gap}${st}" ${q.zone ? `style="--z:var(--z-${q.zone})"` : ''} aria-label="${i + 1}"></button>`;
  }).join('');

  const card = p.type === 'overview' ? overviewHTML(r) : p.type === 'ingredients' ? ingredientsHTML(r) : stepHTML(p);
  $('body').innerHTML = card + nextLineHTML(r);
  $('prevBtn').disabled = state.page === 0;
  $('nextBtn').disabled = state.page === r.pages.length - 1;
  fit();
  store.set('hfr.last', { id: r.id, page: state.page });
}

// Shrink the text until the whole page fits — with foot pedals there is no scrolling
function fit() {
  const card = document.querySelector('#body .card');
  if (!card) return;
  let fs = 1;
  card.style.setProperty('--fs', fs);
  while (card.scrollHeight > card.clientHeight + 1 && fs > 0.5) {
    fs = Math.round((fs - 0.04) * 100) / 100;
    card.style.setProperty('--fs', fs);
  }
}
let fitTimer;
window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 80); });

function overviewHTML(r) {
  const route = r.steps.map((s, i) =>
    `${i ? '<span class="arr">→</span>' : ''}<span class="rc" style="--z:var(--z-${s.zone})">${ZONES[s.zone].icon}${i + 1}</span>`).join('');
  return `<section class="card">
    <p class="kicker">${T.ready} · ${T.serves(r.serves)} · ${T.minutes(r.minutes)} · ${T.stepsN(r.steps.length)}</p>
    <h1 class="ov-title">${esc(t(r.name))}</h1>
    <p class="intro">${esc(t(r.intro))}</p>
    <p class="section-label">${T.tools}</p>
    <p class="tools">${esc(t(r.tools))}</p>
    <p class="section-label">${T.route}</p>
    <div class="route-chips">${route}</div>
  </section>`;
}
function ingredientsHTML(r) {
  return `<section class="card">
    <p class="kicker">${T.ready} · ${esc(t(r.name))}</p>
    <h1 class="ov-title">${T.ingredients}</h1>
    <ul class="ing">${r.ingredients.map(([n, a]) => `<li><span>${esc(t(n))}</span><span>${fmt(t(a))}</span></li>`).join('')}</ul>
  </section>`;
}

function stepHTML(p) {
  const s = p.step;
  const dots = s.how.map((_, k) => `<i class="${k <= p.sub ? 'on' : ''}"></i>`).join('');
  const uses = p.first && s.uses?.length
    ? `<div class="uses">${s.uses.map(u => `<span class="chip">${fmt(t(u))}</span>`).join('')}</div>` : '';
  return `<section class="card step" style="--z:var(--z-${p.zone})">
    <div class="step-head"><span class="zone-tag">${zoneLabel(p.zone)}</span><span class="count">${T.stepOf(p.n, p.total)}</span>
      ${p.subs > 1 ? `<span class="subdots">${dots}</span>` : ''}</div>
    <div class="step-title"><span class="verb">${esc(t(s.verb))}</span><span>${esc(t(s.title))}</span></div>
    <div class="instr"><span>${fmt(t(p.text))}</span></div>
    ${uses}
    ${p.last && s.done ? `<div class="callout done"><span class="ic">✓</span><div><b>${T.doneLook}：</b>${fmt(t(s.done))}</div></div>` : ''}
    ${p.last && s.warn ? `<div class="callout warn"><span class="ic">!</span><div><b>${T.careful}：</b>${fmt(t(s.warn))}</div></div>` : ''}
  </section>`;
}

function nextLineHTML(r) {
  const p = page();
  const np = r.pages[state.page + 1];
  if (!np) return `<div class="next-line" style="--z:var(--ok)"><span class="nt">🍽 ${T.finish}</span></div>`;
  if (np.type !== 'step') return '';
  if (p.type === 'step' && np.si === p.si) {
    return `<div class="next-line" style="--z:var(--z-${np.zone})"><span class="nl">${T.then}</span><span class="nt">${esc(t(np.text))}</span></div>`;
  }
  const move = p.type === 'step' && np.zone !== p.zone ? `<span class="nz">${T.goNext(zoneLabel(np.zone))}</span>` : '';
  return `<div class="next-line" style="--z:var(--z-${np.zone})"><span class="nl">${T.nextStep}</span>${move}<span class="nt">${esc(t(np.step.title))}</span></div>`;
}

function pingZone(pedal) {
  zonesAt(pedal).forEach(z => {
    const el = document.querySelector(`#strip .zone[data-zone="${z}"]`);
    if (!el) return;
    el.classList.remove('ping'); void el.offsetWidth; el.classList.add('ping');
  });
}

let flashTimer;
function flash(msg, ms = 1200) {
  const el = $('flash');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove('show'), ms);
}

/* ---------- Language ---------- */
function applyLang() {
  T = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = T[el.dataset.i18nTitle]; });
  $('langBtn').textContent = lang === 'en' ? '中文' : 'EN';
  $('prevBtn').textContent = T.prev;
  $('nextBtn').textContent = T.next;
  $('legend').innerHTML = T.legend;
  setReading(reading);
  refreshConn();
  renderToggles();
  renderPicker();
  renderLayoutEditor();
  render();
}
function setLang(l) { stopReading(); lang = l; store.set('hfr.lang', l); applyLang(); }

/* ---------- Read aloud ---------- */
const voices = { en: null, zh: null };
function pickVoice() {
  const all = speechSynthesis.getVoices();
  voices.en = all.find(v => /en[-_]US/i.test(v.lang) && v.localService) || all.find(v => /^en/i.test(v.lang)) || null;
  voices.zh = all.find(v => /zh[-_]CN/i.test(v.lang)) || all.find(v => /^zh/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

const forSpeech = {
  en: s => s
    .replace(/½/g, ' and a half ').replace(/¼/g, ' a quarter ')
    .replace(/(\d)\s*[–-]\s*(\d)/g, '$1 to $2')
    .replace(/(\d)\s*g\b/g, '$1 grams').replace(/(\d)\s*ml\b/gi, '$1 milliliters')
    .replace(/(\d)\s*mm\b/g, '$1 millimeters').replace(/(\d)\s*cm\b/g, '$1 centimeters')
    .replace(/(\d)\s*L\b/g, '$1 liter').replace(/\btbsp\b/g, 'tablespoons').replace(/\btsp\b/g, 'teaspoons')
    .replace(/→/g, ', then '),
  zh: s => s
    .replace(/(\d)\s*[–\-~]\s*(\d)/g, '$1到$2')
    .replace(/1\/2/g, '半').replace(/(\d)\s*g\b/gi, '$1克').replace(/(\d)\s*ml/gi, '$1毫升')
    .replace(/(\d)\s*mm/gi, '$1毫米').replace(/(\d)\s*cm/gi, '$1厘米').replace(/(\d)\s*L\b/g, '$1升')
    .replace(/→/g, '，然后').replace(/[（）]/g, '，'),
};

function pageSpeech(p) {
  const r = state.recipe;
  const zh = lang === 'zh';
  if (p.type === 'overview') return zh ? `${t(r.name)}。${t(r.intro)}` : `${t(r.name)}. ${t(r.intro)}`;
  if (p.type === 'ingredients') {
    return zh ? `需要：${r.ingredients.map(([n, a]) => t(n) + t(a)).join('、')}。`
      : `You need: ${r.ingredients.map(([n, a]) => `${t(a)} ${t(n)}`).join(', ')}.`;
  }
  const s = p.step;
  let out = '';
  if (p.first) out += zh ? `第${p.n}步，在${t(ZONES[p.zone].name)}，${t(s.title)}。` : `Step ${p.n}, at the ${t(ZONES[p.zone].name)}: ${t(s.title)}. `;
  out += t(p.text) + (zh ? '。' : '. ');
  if (p.last && s.done) out += zh ? `做好的样子：${t(s.done)}。` : `Done when: ${t(s.done)}. `;
  if (p.last && s.warn) out += zh ? `注意：${t(s.warn)}。` : `Careful: ${t(s.warn)}.`;
  return out;
}

let reading = false;
let current = null;
function setReading(on) {
  reading = on;
  $('readBtn').textContent = on ? T.stop : T.read;
  $('readBtn').classList.toggle('reading', on);
}
function speak(text) {
  if (!('speechSynthesis' in window)) { flash(T.noSpeech); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(forSpeech[lang](text));
  u.lang = lang === 'zh' ? 'zh-CN' : 'en-US';
  if (voices[lang]) u.voice = voices[lang];
  u.rate = 0.95;
  u.onend = u.onerror = () => { if (current === u) setReading(false); };
  current = u;
  setReading(true);
  setTimeout(() => { if (current === u) speechSynthesis.speak(u); }, 60);
}
function stopReading() {
  current = null;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  setReading(false);
}

/* ---------- Pedal gestures ---------- */
function onTap() { if (reading) { stopReading(); flash(T.stopped); return; } next(); }
function onDoubleTap() { if (reading) { stopReading(); flash(T.stopped); return; } prev(); }
function onHold() { readPage(); }

function goPage(i) {
  const r = state.recipe;
  if (!r) return;
  state.page = Math.max(0, Math.min(i, r.pages.length - 1));
  render();
  if (state.autoRead) readPage();
}
function next() {
  const r = state.recipe;
  if (!r) return;
  if (state.page >= r.pages.length - 1) { flash(T.last); return; }
  goPage(state.page + 1);
}
function prev() {
  if (!state.recipe) return;
  if (state.page === 0) { flash(T.first); return; }
  goPage(state.page - 1);
}
function readPage() { if (state.recipe) speak(pageSpeech(page())); }

function goStation(i) {
  if (port) send(`GOTO ${i}`);
  else { state.at = i; render(); pingZone(i); }
}
function toggleLock() {
  state.locked = !state.locked;
  if (port) send(state.locked ? 'LOCK' : 'UNLOCK');
  renderToggles();
  render();
  flash(state.locked ? T.locked : T.unlocked);
}
function renderToggles() {
  $('lockBtn').setAttribute('aria-pressed', state.locked);
  $('autoBtn').setAttribute('aria-pressed', state.autoRead);
}

/* ---------- Recipe picker ---------- */
function openRecipe(id, pageIdx = 0) {
  const r = RECIPES.find(x => x.id === id) || RECIPES[0];
  state.recipe = { ...r, pages: pagesOf(r) };
  state.page = Math.max(0, Math.min(pageIdx, state.recipe.pages.length - 1));
  stopReading();
  render();
  renderPicker();
}
function renderPicker() {
  $('recipeCards').innerHTML = RECIPES.map(r => {
    const route = r.steps.map(s => `<span class="rc" style="--z:var(--z-${s.zone})">${ZONES[s.zone].icon}</span>`).join('');
    return `<button class="recipe-card ${state.recipe?.id === r.id ? 'current' : ''}" data-id="${r.id}">
      <div class="rn">${esc(t(r.name))}</div>
      <div class="rm">${T.serves(r.serves)} · ${T.minutes(r.minutes)} · ${T.stepsN(r.steps.length)}</div>
      <div class="route-chips">${route}</div>
    </button>`;
  }).join('');
}
$('recipeBtn').onclick = () => $('picker').showModal();
$('recipeCards').onclick = e => {
  const b = e.target.closest('[data-id]');
  if (!b) return;
  $('picker').close();
  openRecipe(b.dataset.id, 0);
};

/* ---------- Kitchen layout editor ---------- */
const LAYOUT_ICONS = {
  line: '<svg viewBox="0 0 54 38"><rect x="3" y="14" width="48" height="10" rx="2"/></svg>',
  l: '<svg viewBox="0 0 54 38"><rect x="3" y="6" width="48" height="10" rx="2"/><rect x="3" y="6" width="10" height="28" rx="2"/></svg>',
  galley: '<svg viewBox="0 0 54 38"><rect x="3" y="4" width="48" height="9" rx="2"/><rect x="3" y="25" width="48" height="9" rx="2"/></svg>',
  island: '<svg viewBox="0 0 54 38"><rect x="3" y="4" width="48" height="9" rx="2"/><rect x="15" y="22" width="24" height="10" rx="2"/></svg>',
};
function renderLayoutEditor() {
  $('layoutTypes').innerHTML = Object.entries(T.layouts).map(([k, [name, sub]]) =>
    `<label>${LAYOUT_ICONS[k]}<input type="radio" name="ltype" value="${k}" ${k === layout.type ? 'checked' : ''} ${k === 'line' ? '' : 'disabled'}>${name}<small>${sub}</small></label>`).join('');
  $('layoutPreview').innerHTML = stripHTML(null, { preview: true });
  const lastIdx = layout.order.length - 1;
  $('zoneList').innerHTML = layout.order.map((z, i) => {
    const opts = [0, 1, 2].map(p => `<option value="${p}" ${layout.pedal[z] === p ? 'selected' : ''}>${T.pedalN(p + 1)}</option>`).join('')
      + `<option value="-1" ${layout.pedal[z] === -1 ? 'selected' : ''}>${T.noPedal}</option>`;
    return `<li style="--z:var(--z-${z})">
      <span class="pos">${i + 1}</span><span class="zi">${ZONES[z].icon}</span>
      <span class="zt"><b>${esc(t(ZONES[z].name))}</b><small>${esc(t(ZONES[z].what))}</small></span>
      <select data-pedal="${z}" aria-label="pedal">${opts}</select>
      <button data-move="${z}" data-dir="-1" ${i === 0 ? 'disabled' : ''} title="${T.moveLeft}" aria-label="${T.moveLeft}">↑</button>
      <button data-move="${z}" data-dir="1" ${i === lastIdx ? 'disabled' : ''} title="${T.moveRight}" aria-label="${T.moveRight}">↓</button>
    </li>`;
  }).join('');
}
$('zoneList').onclick = e => {
  const b = e.target.closest('[data-move]');
  if (!b) return;
  const i = layout.order.indexOf(b.dataset.move), j = i + +b.dataset.dir;
  if (j < 0 || j >= layout.order.length) return;
  [layout.order[i], layout.order[j]] = [layout.order[j], layout.order[i]];
  saveLayout();
};
$('zoneList').onchange = e => {
  const s = e.target.closest('[data-pedal]');
  if (!s) return;
  layout.pedal[s.dataset.pedal] = +s.value;
  saveLayout();
};
$('resetLayout').onclick = () => { layout = structuredClone(DEFAULT_LAYOUT); saveLayout(); };
$('settingsBtn').onclick = () => $('settings').showModal();
document.querySelectorAll('dialog').forEach(d => {
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
  d.addEventListener('close', () => fit());
});

/* ---------- Clicks on the page ---------- */
$('strip').onclick = e => {
  const z = e.target.closest('[data-zone]')?.dataset.zone;
  if (!z) return;
  const p = layout.pedal[z];
  if (p < 0) { flash(T.noPedalThere); return; }
  goStation(p);
};
document.addEventListener('click', e => {
  const pg = e.target.closest('#progress [data-page]');
  if (pg) { goPage(+pg.dataset.page); return; }
});
$('prevBtn').onclick = () => onDoubleTap();
$('nextBtn').onclick = () => onTap();
$('readBtn').onclick = () => (reading ? stopReading() : readPage());

/* ---------- Web Serial ---------- */
let port = null;
let writer = null;
let connErr = '';

function log(line) {
  const el = $('log');
  el.textContent = (el.textContent + line + '\n').split('\n').slice(-200).join('\n');
  el.scrollTop = el.scrollHeight;
}
async function send(cmd) {
  if (!writer) return;
  log('→ ' + cmd);
  await writer.write(cmd + '\n');
}
function setConnected(on, err = '') { connErr = on ? '' : err; refreshConn(); }
function refreshConn() {
  const on = !!port;
  $('connDot').className = 'dot' + (on ? ' on' : connErr ? ' err' : '');
  $('connText').textContent = on ? T.connected : connErr ? T.failed : T.notConnected;
  $('connectBtn').title = on ? T.disconnect : T.notConnected;
  $('hint').textContent = connErr ? T[connErr] : '';
  fit();
}

function handleLine(line) {
  log('← ' + line);
  const [cmd, a] = line.trim().split(/\s+/);
  const i = parseInt(a, 10);
  switch (cmd) {
    case 'READY': if (state.locked) send('LOCK'); break;
    case 'STATION':
      state.at = i; state.moving = true; render(); pingZone(i);
      flash(T.turning(zonesAt(i).map(z => t(ZONES[z].name)).join(' / ') || T.pedalN(i + 1)));
      break;
    case 'ARRIVED': state.at = i; state.moving = false; render(); break;
    // The pedal that was pressed tells us where the person is standing (also while turning is locked)
    case 'NEXT': state.at = i; onTap(); render(); pingZone(i); break;
    case 'PREV': state.at = i; onDoubleTap(); render(); pingZone(i); break;
    case 'READ': state.at = i; onHold(); render(); pingZone(i); break;
    case 'LOCK': state.locked = a === '1'; renderToggles(); render(); break;
    case 'STATUS': {
      const f = line.match(/facing=(\d)/), l = line.match(/locked=(\d)/);
      if (f) state.at = +f[1];
      if (l && (l[1] === '1') !== state.locked) send(state.locked ? 'LOCK' : 'UNLOCK');
      state.moving = false;
      render();
      break;
    }
  }
}

async function openPort(p) {
  try { await p.open({ baudRate: 115200 }); }
  catch (e) { log('Open failed: ' + e.name + ' ' + e.message); setConnected(false, 'busy'); return false; }
  port = p;
  setConnected(true);
  const encoder = new TextEncoderStream();
  encoder.readable.pipeTo(port.writable).catch(() => {});
  writer = encoder.writable.getWriter();
  readLoop();
  setTimeout(() => send('STATUS'), 300);
  return true;
}
async function connect() {
  if (!('serial' in navigator)) { setConnected(false, 'noSerial'); return; }
  let p;
  try { p = await navigator.serial.requestPort(); }
  catch (e) { log('No port chosen: ' + e.message); setConnected(false, 'noPort'); return; }
  openPort(p);
}
async function readLoop() {
  const dec = new TextDecoderStream();
  const closed = port.readable.pipeTo(dec.writable).catch(() => {});
  const reader = dec.readable.getReader();
  port._reader = reader;
  let buf = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let n;
      while ((n = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, n).trim();
        buf = buf.slice(n + 1);
        if (line) handleLine(line);
      }
    }
  } catch (e) { log('Serial disconnected: ' + e.message); }
  await closed;
  disconnect();
}
async function disconnect() {
  if (!port) return;
  const p = port;
  port = null;
  try { await p._reader?.cancel(); } catch (e) {}
  try { await writer?.close(); } catch (e) {}
  writer = null;
  try { await p.close(); } catch (e) {}
  setConnected(false);
}
async function autoConnect() {
  if (!('serial' in navigator) || port) return;
  const ports = await navigator.serial.getPorts();
  if (ports.length) openPort(ports[0]);
}
if ('serial' in navigator) {
  navigator.serial.addEventListener('connect', autoConnect);
  navigator.serial.addEventListener('disconnect', e => { if (e.target === port) disconnect(); });
}

$('connectBtn').onclick = () => (port ? disconnect() : connect());
$('lockBtn').onclick = toggleLock;
$('autoBtn').onclick = () => { state.autoRead = !state.autoRead; store.set('hfr.auto', state.autoRead); renderToggles(); };
$('langBtn').onclick = () => setLang(lang === 'en' ? 'zh' : 'en');

/* ---------- Keyboard (testing without hardware) ---------- */
document.addEventListener('keydown', e => {
  if (document.querySelector('dialog[open]') || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') onTap();
  else if (e.key === 'ArrowLeft') onDoubleTap();
  else if (e.key === ' ') { e.preventDefault(); onHold(); }
  else if (['1', '2', '3'].includes(e.key)) goStation(+e.key - 1);
  else if (e.key === 'l' || e.key === 'L') toggleLock();
  else if (e.key === 'a' || e.key === 'A') $('autoBtn').click();
  else if (e.key === '/') { e.preventDefault(); $('picker').showModal(); }
});

/* ---------- Start ---------- */
const lastOpen = store.get('hfr.last');
openRecipe(lastOpen?.id || RECIPES[0].id, lastOpen?.page || 0);
applyLang();
autoConnect();
</script>
</body>
</html>
